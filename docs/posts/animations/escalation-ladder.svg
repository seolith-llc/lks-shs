<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Escalation ladder: a fault rises through healing layers — hardware and kernel heal first, then restart, then rollback, then AI-assisted human fix — each gate lighting up in turn until verified healed.">
  <rect width="640" height="420" rx="12" fill="#0B2545"/>
  <text x="320" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#E0FBFC" font-weight="600">Heal at the lowest layer that works — escalate only on repeat</text>

  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8DA9C4"/>
    </marker>
  </defs>

  <g font-family="system-ui, sans-serif">
    <!-- bottom-up ladder; each step glows then hands up if it fails -->
    <g>
      <rect x="90" y="352" width="460" height="46" rx="10" fill="#2EC4B6" opacity="0.35">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="372" text-anchor="middle" font-size="14" fill="#E0FBFC" font-weight="600">L1–L2 · hardware + kernel heal (µs–s, dumb, certain)</text>
      <text x="320" y="390" text-anchor="middle" font-size="12" fill="#0B2545" opacity="0.9">ECC · livepatch · OOM policy · kdump reboot</text>
    </g>
    <line x1="320" y1="352" x2="320" y2="322" stroke="#8DA9C4" stroke-width="2" marker-end="url(#up)"/>
    <text x="336" y="342" font-size="11" fill="#FFD166">persists?</text>

    <g>
      <rect x="90" y="276" width="460" height="46" rx="10" fill="#4CC9F0" opacity="0.35">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="296" text-anchor="middle" font-size="14" fill="#E0FBFC" font-weight="600">L3 · restart with backoff (s, scripted)</text>
      <text x="320" y="314" text-anchor="middle" font-size="12" fill="#0B2545" opacity="0.9">supervisor · probes · MaxR/MaxT — restart ≠ repair</text>
    </g>
    <line x1="320" y1="276" x2="320" y2="246" stroke="#8DA9C4" stroke-width="2" marker-end="url(#up)"/>
    <text x="336" y="266" font-size="11" fill="#FFD166">≥ MaxR?</text>

    <g>
      <rect x="90" y="200" width="460" height="46" rx="10" fill="#FF9F1C" opacity="0.35">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="220" text-anchor="middle" font-size="14" fill="#0B2545" font-weight="600">L6 · roll back the change (s–min, reversible)</text>
      <text x="320" y="238" text-anchor="middle" font-size="12" fill="#0B2545" opacity="0.9">canary analysis · auto-rollback · flag kill switch</text>
    </g>
    <line x1="320" y1="200" x2="320" y2="170" stroke="#8DA9C4" stroke-width="2" marker-end="url(#up)"/>
    <text x="336" y="190" font-size="11" fill="#FFD166">novel fault?</text>

    <g>
      <rect x="90" y="124" width="460" height="46" rx="10" fill="#E71D36" opacity="0.35">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="144" text-anchor="middle" font-size="14" fill="#E0FBFC" font-weight="600">L7 · AI diagnoses → human-gated fix PR (min, smart)</text>
      <text x="320" y="162" text-anchor="middle" font-size="12" fill="#E0FBFC" opacity="0.9">investigator → validators (non-AI) → review → canary</text>
    </g>
    <line x1="320" y1="124" x2="320" y2="94" stroke="#FFD166" stroke-width="2" marker-end="url(#up)"/>
    <text x="336" y="114" font-size="11" fill="#FFD166">verified</text>

    <g>
      <rect x="150" y="48" width="340" height="46" rx="10" fill="#9EF01A" opacity="0.35">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" begin="7s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="68" text-anchor="middle" font-size="14" fill="#0B2545" font-weight="700">Evolve: postmortem · harden · update policy</text>
      <text x="320" y="86" text-anchor="middle" font-size="12" fill="#0B2545" opacity="0.9">healing without learning is just rebooting</text>
    </g>
  </g>

  <text x="320" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8DA9C4">lks-shs · docs/architecture/sequence-diagrams.md (D5–D6)</text>
</svg>
